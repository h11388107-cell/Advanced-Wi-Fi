
name: Build Advanced Wi-Fi APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Android project
        run: |
          WRAPPER=$(find extracted -type f -path '*/android/gradlew' -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "Android Gradle wrapper not found"
            exit 1
          fi
          ROOT="${WRAPPER%/android/gradlew}"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-WiFi-APK
          path: extracted/**/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
