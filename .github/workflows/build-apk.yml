
name: Build Advanced Wi-Fi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Locate Android project
        run: |
          WRAPPER=$(find project -type f -path '*/android/gradlew' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: android/gradlew not found"
            find project -maxdepth 4 -type f
            exit 1
          fi

          ROOT="${WRAPPER%/android/gradlew}"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_ROOT/android/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK generated successfully"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Advanced-WiFi-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          
